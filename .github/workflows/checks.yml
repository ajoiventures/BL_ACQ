name: Pilot checks

on:
  pull_request:
  push:
    branches: [main, development/learning-workspace]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-checks.txt -r requirements-docai.txt
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tools/check_pilot.py
