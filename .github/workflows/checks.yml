name: Pilot checks

on:
  pull_request:
  push:
    branches: [main, development/learning-workspace]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-checks.txt
      - run: ruff check --select E9,F63,F7,F82 pilot tests tools Python_Asset_Demo
      - run: python -m mypy --follow-imports=silent --ignore-missing-imports pilot/contracts.py pilot/connectors.py pilot/cuda_screen.py
      - run: python -m unittest discover -s Python_Asset_Demo
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/check_guides.py
      - run: python -m pilot.acceptance
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tools/replay_founder.py --engine both
